<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2230"></stop>
      <stop offset="100%" stop-color="#0a0c12"></stop>
    </linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"></stop>
      <stop offset="100%" stop-color="#e6b400"></stop>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5252"></stop>
      <stop offset="100%" stop-color="#cc2828"></stop>
    </linearGradient>
    <radialGradient id="glass" cx="50%" cy="50%" r="55%">
      <stop offset="60%" stop-color="white" stop-opacity="0"></stop>
      <stop offset="85%" stop-color="white" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0.18"></stop>
    </radialGradient>
    <radialGradient id="hex-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcb05" stop-opacity="0.55"></stop>
      <stop offset="60%" stop-color="#ffcb05" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"></feGaussianBlur>
      <feOffset dx="0" dy="18"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.60"></feFuncA></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="out"></feComposite>
    </filter>
    <clipPath id="clip"><circle cx="512" cy="512" r="460"></circle></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"></rect>
  <g filter="url(#drop)"><circle cx="512" cy="512" r="460" fill="#0a0c12"></circle></g>
  <g>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="1024" height="488" fill="url(#y)"></rect>
      <rect x="0" y="488" width="1024" height="48" fill="#0a0c12"></rect>
      <rect x="0" y="536" width="1024" height="488" fill="url(#r)"></rect>
      <ellipse cx="380" cy="240" rx="280" ry="84" fill="white" fill-opacity="0.34"></ellipse>
      <ellipse cx="700" cy="820" rx="120" ry="26" fill="white" fill-opacity="0.10"></ellipse>
      <circle cx="512" cy="512" r="460" fill="url(#glass)"></circle>
    </g>
    <circle cx="512" cy="512" r="460" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3"></circle>
    <circle cx="512" cy="512" r="456" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="2"></circle>
    <circle cx="512" cy="512" r="180" fill="url(#hex-glow)"></circle>
    <g transform="translate(512 512)">
      <circle r="138" fill="#0a0c12" stroke="rgba(0,0,0,0.55)" stroke-width="3"></circle>
      <circle r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"></circle>
      <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="#14171f" transform="scale(0.88)"></path>
      <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#ffcb05" stroke-width="10" transform="scale(0.88)"></path>
      <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="rgba(255, 230, 100, 0.55)" stroke-width="2" transform="scale(0.88)"></path>
      <circle cx="86" cy="-86" r="26" fill="#ff5252"></circle>
      <circle cx="86" cy="-86" r="26" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"></circle>
    </g>
  </g>
</svg>